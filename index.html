<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookaholic</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: #1c1c1e;
    background: #ffffff;
  }
  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
    line-height: 1.25;
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 2rem 0 0.75rem;
    padding-top: 0.5rem;
    border-top: 1px solid #e5e5ea;
  }
  h2:first-of-type {
    border-top: none;
    padding-top: 0;
  }
  h3 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 1.5rem 0 0.6rem;
  }
  p {
    margin: 0 0 1rem;
  }
  ul {
    margin: 0 0 1rem;
    padding-left: 1.25rem;
  }
  li {
    margin-bottom: 0.4rem;
  }
  .updated {
    color: #6e6e73;
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }
  strong {
    font-weight: 600;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #f2f2f7;
    padding: 0.1em 0.4em;
    border-radius: 4px;
    font-size: 0.92em;
  }
  a {
    color: #0066cc;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  hr {
    border: none;
    border-top: 1px solid #e5e5ea;
    margin: 2.5rem 0;
  }
  footer {
    color: #6e6e73;
    font-size: 0.85rem;
    text-align: center;
    margin-top: 3rem;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #000000;
      color: #f2f2f7;
    }
    h2 {
      border-top-color: #2c2c2e;
    }
    .updated, footer {
      color: #98989f;
    }
    code {
      background: #1c1c1e;
    }
    a {
      color: #4da3ff;
    }
    hr {
      border-top-color: #2c2c2e;
    }
  }
</style>
</head>
<body>
<div class="container">

  <h1>Bookaholic</h1>
  <p class="updated">A local-first language-learning e-book reader for iPhone.</p>

  <h2>Support</h2>
  <ul>
    <li><a href="support.html">Support &amp; FAQ (English)</a></li>
    <li><a href="support.zh-Hant.html">支援與常見問題（繁體中文）</a></li>
  </ul>

  <h2>Privacy</h2>
  <ul>
    <li><a href="privacy-policy.html">Privacy Policy (English)</a></li>
    <li><a href="privacy-policy.zh-Hant.html">隱私權政策（繁體中文）</a></li>
  </ul>

  <h2>Contact</h2>
  <p><a href="mailto:ethanfufu20@gmail.com">ethanfufu20@gmail.com</a></p>

  <hr>
  <footer>&copy; 2026 Bookaholic</footer>

</div>
</body>
</html>
